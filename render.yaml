services:
  # Frontend Static Site
  - type: static
    name: medora-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medora-backend
          property: host

  # Backend Flask Web Service
  - type: web
    name: medora-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: EMERGENCY_BASE_URL
        fromService:
          type: static
          name: medora-frontend
          property: host
      - key: FRONTEND_URL
        fromService:
          type: static
          name: medora-frontend
          property: host

